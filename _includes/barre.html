{% assign sur_accueil = false %}
{% if page.url == "/" or page.collection == "articles" %}{% assign sur_accueil = true %}{% endif %}
<header class="barre">
  <a class="barre-identite" href="{{ '/' | relative_url }}">
    <img class="barre-photo" src="{{ site.photo | relative_url }}" alt="Portrait de {{ site.title }}" width="640" height="640">
    <span class="barre-nom">{{ site.title }}</span>
  </a>
  <nav class="barre-nav" aria-label="Navigation principale">
    <a href="{{ '/' | relative_url }}"{% if sur_accueil %} class="actif"{% endif %}{% if page.url == "/" %} aria-current="page"{% endif %}>Accueil</a>
    <a href="{{ '/a-propos/' | relative_url }}"{% if page.url == "/a-propos/" %} class="actif" aria-current="page"{% endif %}>À propos</a>
  </nav>
  <div class="barre-liens">
    <a href="{{ site.linkedin }}" rel="me noopener" target="_blank" aria-label="Profil LinkedIn (nouvel onglet)" class="rond rond-in">in</a>
    <a href="mailto:{{ site.email }}" aria-label="Écrire un e-mail à {{ site.title }}" class="rond">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1.4 2L12 12.2 19.6 7H4.4ZM20 8.4l-7.4 5a1 1 0 0 1-1.2 0L4 8.4V17h16V8.4Z"/></svg>
    </a>
  </div>
</header>
